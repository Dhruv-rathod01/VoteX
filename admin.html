<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Election Analytics Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

.dashboard{
    max-width:1400px;
    margin:30px auto;
    padding:20px;
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.card{
    background:white;
    border-radius:15px;
    padding:25px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.card h3{
    color:#003366;
}

.card p{
    font-size:30px;
    font-weight:bold;
    margin-top:10px;
}

.winner-card{
    background:#ffd700;
}

.search-box{
    margin-bottom:20px;
}

.search-box input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #ccc;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
}

table th{
    background:#003366;
    color:white;
}

table th,
table td{
    padding:14px;
    border:1px solid #ddd;
    text-align:center;
}

</style>

</head>
<body>

<header class="top-header">

<div class="logo-section">

<img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg">

<div>
<h1>Election Commission of India</h1>
<p>Election Analytics Dashboard</p>
</div>

</div>

</header>

<div class="dashboard">

<div class="cards">

<div class="card">
<h3>Total Votes</h3>
<p id="totalVotes">0</p>
</div>

<div class="card">
<h3>🌷 BJP</h3>
<p id="bjpCount">0</p>
</div>

<div class="card">
<h3>✋ Congress</h3>
<p id="congressCount">0</p>
</div>

<div class="card">
<h3>🧹 AAP</h3>
<p id="aapCount">0</p>
</div>

<div class="card">
<h3>🐘 BSP</h3>
<p id="bspCount">0</p>
</div>

<div class="card">
<h3>🚲 SP</h3>
<p id="spCount">0</p>
</div>

<div class="card winner-card">
<h3>🏆 Winner</h3>
<p id="winner">-</p>
</div>

</div>

<div class="search-box">
<input
type="text"
id="searchInput"
placeholder="Search voter by name or mobile..."
onkeyup="searchTable()">
</div>

<table>

<thead>

<tr>
<th>Name</th>
<th>Mobile</th>
<th>Party</th>
</tr>

</thead>

<tbody id="voterTable">

</tbody>

</table>

</div>

<script type="module">

import { db } from "./firebase-config.js";

import {
collection,
getDocs
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const snapshot =
await getDocs(collection(db,"votes"));

let bjp=0;
let congress=0;
let aap=0;
let bsp=0;
let sp=0;

const table =
document.getElementById("voterTable");

snapshot.forEach((doc)=>{

const data = doc.data();

table.innerHTML += `
<tr>
<td>${data.name}</td>
<td>${data.mobile}</td>
<td>${data.party}</td>
</tr>
`;

if(data.party==="BJP") bjp++;
if(data.party==="Congress") congress++;
if(data.party==="AAP") aap++;
if(data.party==="BSP") bsp++;
if(data.party==="SP") sp++;

});

document.getElementById("bjpCount").innerText=bjp;
document.getElementById("congressCount").innerText=congress;
document.getElementById("aapCount").innerText=aap;
document.getElementById("bspCount").innerText=bsp;
document.getElementById("spCount").innerText=sp;

const total =
bjp+congress+aap+bsp+sp;

document.getElementById("totalVotes").innerText =
total;

const parties = {
BJP:bjp,
Congress:congress,
AAP:aap,
BSP:bsp,
SP:sp
};

let winner="-";
let max=-1;

for(let party in parties){

if(parties[party] > max){

max = parties[party];
winner = party;

}

}

document.getElementById("winner").innerText =
winner;

window.searchTable = function(){

const input =
document.getElementById("searchInput")
.value.toLowerCase();

const rows =
document.querySelectorAll("#voterTable tr");

rows.forEach(row=>{

const text =
row.innerText.toLowerCase();

row.style.display =
text.includes(input)
? ""
: "none";

});

}

</script>

</body>
</html>
